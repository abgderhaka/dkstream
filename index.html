<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DK TV Premium</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
  :root { --hijau:#00e676; --latar:#101312; --kad:#1b201e; --garis:#2c3430; --teks:#f2f5f3; --malap:#93a09a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--latar); color:var(--teks); font-family:"Segoe UI",Arial,sans-serif; }
  .bungkus { max-width:960px; margin:0 auto; padding:20px 16px 40px; }

  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  header h1 { margin:0; font-size:22px; letter-spacing:1px; color:var(--hijau); }
  #sedang { font-size:14px; color:var(--malap); }
  #sedang b { color:var(--teks); }

  .pemain { position:relative; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden;
            box-shadow:0 0 24px rgba(0,230,118,.25); }
  #skrin-tv, #skrin-iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
  #skrin-iframe { display:none; }

  #status { min-height:22px; margin:10px 2px 0; font-size:14px; color:var(--malap); }
  #status.error { color:#ff6b6b; }

  h2 { font-size:15px; font-weight:600; margin:22px 2px 10px; color:var(--malap); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; }
  .kad { background:var(--kad); border:2px solid var(--garis); border-radius:12px; padding:14px 8px 10px;
         display:flex; flex-direction:column; align-items:center; gap:10px; cursor:pointer;
         color:var(--teks); font:inherit; transition:border-color .2s, background .2s; }
  .kad:hover { border-color:var(--hijau); }
  .kad:focus-visible { outline:3px solid var(--hijau); outline-offset:2px; }
  .kad.aktif { border-color:var(--hijau); background:#14301f; }
  .logo { width:84px; height:56px; display:flex; align-items:center; justify-content:center; }
  .logo img { max-width:100%; max-height:100%; object-fit:contain; }
  .lencana { width:56px; height:56px; border-radius:50%; background:var(--garis); color:var(--hijau);
             display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; }
  .nama { font-size:13px; font-weight:600; text-align:center; }

  @media (max-width:480px) { .grid { grid-template-columns:repeat(3,1fr); gap:8px; } .logo { width:64px; height:44px; } }
</style>
</head>
<body>
<div class="bungkus">

  <header>
    <h1>DK TV PREMIUM</h1>
    <div id="sedang">Pilih saluran</div>
  </header>

  <div class="pemain">
    <video id="skrin-tv" controls autoplay muted playsinline></video>
    <iframe id="skrin-iframe" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>
  <div id="status"></div>

  <h2>Saluran</h2>
  <div class="grid" id="grid"></div>

</div>

<script>
/* ================= SENARAI SALURAN =================
   Tambah saluran baru dengan menambah satu baris di sini.
   jenis : 'm3u8' atau 'iframe'
   logo  : laluan fail dalam repo GitHub anda, atau pautan gambar penuh.
           Kosongkan (atau fail tiada) = papar huruf awal nama.                    */
var PROKSI = 'https://dktv-premium.zqstore80.workers.dev/';
var CF = 'https://d25tgymtnqzu8s.cloudfront.net/';

var saluran = [
  { nama:'TV1', jenis:'m3u8', logo:'logo/tv1.png', url: PROKSI + CF + 'live/media0/tv1/HLS/tv1.m3u8?id=1' },
  { nama:'TV2', jenis:'m3u8', logo:'https://i.imgur.com/1v2qGOd.png', url: PROKSI + CF + 'smil:tv2/chunklist_b2596000_slENG.m3u8?id=2' },
  { nama:'Bernama TV', jenis:'iframe', logo:'logo/bernama.png', url:'https://www.youtube.com/embed/live_stream?channel=UCgDq-Hq0Y16rFmZ7kX2_1-A&autoplay=1' },
  { nama:'Makkah Live', jenis:'m3u8', logo:'logo/makkah.png', url: PROKSI + 'https://quranes-edge.itworks.video/playlist.m3u8' },
  { nama:'Wild Earth', jenis:'m3u8', logo:'logo/wildearth.png', url: PROKSI + 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8' }
];
/* =================================================== */

var video = document.getElementById('skrin-tv');
var iframe = document.getElementById('skrin-iframe');
var statusEl = document.getElementById('status');
var sedangEl = document.getElementById('sedang');
var gridEl = document.getElementById('grid');
var hls = null;
var cuba = 0;

function papar(mesej, ralat) { statusEl.textContent = mesej; statusEl.className = ralat ? 'error' : ''; }

function bina() {
  saluran.forEach(function (s, i) {
    var kad = document.createElement('button');
    kad.className = 'kad';
    kad.type = 'button';
    kad.dataset.i = i;

    var kotak = document.createElement('div');
    kotak.className = 'logo';
    function lencana() {
      kotak.innerHTML = '';
      var l = document.createElement('div');
      l.className = 'lencana';
      l.textContent = s.nama.charAt(0).toUpperCase();
      kotak.appendChild(l);
    }
    if (s.logo) {
      var img = new Image();
      img.alt = s.nama;
      img.onerror = lencana;
      img.src = s.logo;
      kotak.appendChild(img);
    } else { lencana(); }

    var nama = document.createElement('div');
    nama.className = 'nama';
    nama.textContent = s.nama;

    kad.appendChild(kotak);
    kad.appendChild(nama);
    kad.addEventListener('click', function () { main(i); });
    gridEl.appendChild(kad);
  });
}

function hentiHls() {
  if (hls) { hls.destroy(); hls = null; }
  video.removeAttribute('src');
  video.load();
}

function main(i) {
  var s = saluran[i];
  document.querySelectorAll('.kad').forEach(function (k) { k.classList.toggle('aktif', k.dataset.i == i); });
  sedangEl.innerHTML = 'Sedang ditayang: <b>' + s.nama + '</b>';
  hentiHls();
  cuba = 0;

  if (s.jenis === 'iframe') {
    video.style.display = 'none';
    iframe.style.display = 'block';
    iframe.src = s.url;
    papar('');
    return;
  }

  iframe.style.display = 'none';
  iframe.src = '';
  video.style.display = 'block';
  papar('Memuatkan siaran...');

  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ enableWorker:true, maxBufferLength:30 });
    hls.on(Hls.Events.MANIFEST_PARSED, function () { papar(''); video.play().catch(function () {}); });
    hls.on(Hls.Events.ERROR, function (e, d) {
      console.log('HLS error:', d.type, d.details, d.response ? d.response.code : '');
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
        var kod = d.response ? d.response.code : 0;
        if (kod === 401 || kod === 403) { papar('Siaran ditolak oleh server (' + kod + ').', true); hentiHls(); }
        else if (kod === 404) { papar('Pautan tidak ditemui (404).', true); hentiHls(); }
        else {
          cuba++;
          if (cuba > 3) { papar('Gagal sambung (' + d.details + ', kod ' + kod + '). Semak Worker atau pautan.', true); hentiHls(); }
          else { papar('Masalah rangkaian, mencuba semula (' + cuba + '/3)...', true); hls.startLoad(); }
        }
      } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) {
        hls.recoverMediaError();
      } else { papar('Siaran gagal dimainkan.', true); hentiHls(); }
    });
    hls.loadSource(s.url);
    hls.attachMedia(video);
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = s.url;
    video.addEventListener('loadedmetadata', function () { papar(''); video.play().catch(function () {}); }, { once:true });
  } else {
    papar('Pelayar anda tidak menyokong HLS.', true);
  }
}

bina();
main(0);
</script>
</body>
</html>
