<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DK TV Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #121212; color: white; display: flex; flex-direction: column; align-items: center; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        h1 { color: #00ff00; text-transform: uppercase; letter-spacing: 2px; }
        video { width: 100%; max-width: 800px; border-radius: 10px; box-shadow: 0px 0px 20px rgba(0,255,0,0.3); background: #000; }
        .senarai-saluran { display: flex; gap: 15px; margin-top: 25px; flex-wrap: wrap; justify-content: center; }
        button { padding: 10px 25px; background: #333; color: white; border: 2px solid #555; cursor: pointer; border-radius: 5px; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #00ff00; color: black; border-color: #00ff00; transform: scale(1.1); }
    </style>
</head>
<body>

    <h1>DK TV PREMIUM</h1>
    <video id="skrin-tv" controls autoplay></video>

    <!-- Senarai Butang Saluran -->
    <div class="senarai-saluran">
        <!-- Anda boleh tambah banyak butang di sini. Ganti pautan m3u8 untuk siaran lain -->
        <button onclick="tukarSiaran('https://d25tgymtnqzu8s.cloudfront.net/main/A0jyR3/master.m3u8?id=1')">TV1</button>
        <button onclick="tukarSiaran('LINK_M3U8_TV2_DI_SINI')">TV2</button>
        <button onclick="tukarSiaran('LINK_M3U8_TV3_DI_SINI')">TV3</button>
        <button onclick="tukarSiaran('LINK_M3U8_AWANI_DI_SINI')">AWANI</button>
    </div>

    <script>
        var video = document.getElementById('skrin-tv');
        var hls = new Hls();

        // Fungsi untuk menukar siaran tanpa perlu loading page baru
        function tukarSiaran(sumberVideo) {
            if (Hls.isSupported()) {
                hls.loadSource(sumberVideo);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = sumberVideo;
                video.addEventListener('loadedmetadata', function() { video.play(); });
            }
        }

        // Ini untuk memastikan TV1 auto-play bila pelawat mula-mula buka website
        tukarSiaran('https://d25tgymtnqzu8s.cloudfront.net/main/A0jyR3/master.m3u8?id=1');
    </script>
</body>
</html>
