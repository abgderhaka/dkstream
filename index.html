<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06120c">
<title>DK TV Premium</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
/* Muat style.css dengan cap masa supaya perubahan gaya terus sampai */
(function () {
  var l = document.createElement('link');
  l.rel = 'stylesheet'; l.href = 'style.css?t=' + Date.now();
  document.head.appendChild(l);
})();
</script>
<noscript><link rel="stylesheet" href="style.css"></noscript>
</head>
<body>

<header class="atas">
  <div class="jenama">
    <div class="jenama-ikon">&#9654;</div>
    <div class="jenama-nama">DK TV<b>PREMIUM</b><small>Nonton TV Malaysia, Percuma &amp; Berkualiti</small></div>
  </div>
  <label class="cari"><span aria-hidden="true">&#9906;</span><input id="cari" type="search" placeholder="Cari saluran TV..." aria-label="Cari saluran"></label>
  <button class="btn" id="btnFav" type="button" aria-pressed="false"><span aria-hidden="true">&#9733;</span><span class="teks">Kegemaran</span></button>
</header>

<div class="rangka">
  <aside class="sisi" id="sisi"></aside>

  <main>
    <div class="atas-main">
      <div>
        <div class="pemain" id="pemain">
          <video id="skrin-tv" autoplay muted playsinline disablepictureinpicture></video>
          <iframe id="skrin-iframe" allow="autoplay; encrypted-media"></iframe>
          <div class="sekat"></div>
          <div class="penutup"><span class="pusing"></span></div>
          <div class="lencana-live"><i></i>LIVE</div>
          <div class="alat">
            <select id="kualiti" aria-label="Kualiti video" style="display:none"></select>
            <button class="abtn" id="bunyi" type="button"></button>
            <button class="abtn" id="btnPenuh" type="button" aria-label="Skrin penuh" title="Skrin penuh"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
          </div>
          <div class="kosong"><strong>Selamat datang ke DK TV</strong><span>Pilih saluran di bawah untuk mula menonton.</span></div>
        </div>
        <div id="status"></div>
      </div>

      <aside class="kini">
        <h3>Kini Menonton</h3>
        <div class="kini-logo" id="kiniLogo"></div>
        <div>
          <div class="kini-nama" id="kiniNama">Pilih saluran</div>
          <div class="kini-kat" id="kiniKat">&nbsp;</div>
        </div>
        <span class="pil"><i></i>LIVE</span>
        <button class="btn" id="kiniFav" type="button" style="display:none">&#9734; Tambah kegemaran</button>
      </aside>
    </div>

    <div class="tajuk-sen"><h2 id="tajukSen">Semua Saluran</h2><span id="bilangan"></span></div>
    <div class="grid" id="grid"></div>

    <footer>Gunakan pautan siaran yang anda miliki kebenaran untuk distrim. &copy; <span id="tahun"></span> DK TV.</footer>
  </main>
</div>

<script>
/* Muat app.js dengan cap masa: kemas kini logik terus sampai tanpa tunggu cache */
(function () {
  var s = document.createElement('script');
  s.src = 'app.js?t=' + Date.now();
  document.body.appendChild(s);
})();
</script>
</body>
</html>
