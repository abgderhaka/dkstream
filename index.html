<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Live Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #121212; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        video { width: 90%; max-width: 800px; border-radius: 10px; box-shadow: 0px 0px 20px rgba(0,255,0,0.3); background: #000; }
    </style>
</head>
<body>
    <video id="skrin-tv" controls autoplay></video>

    <script>
        var video = document.getElementById('skrin-tv');
        var sumberVideo = 'https://d25tgymtnqzu8s.cloudfront.net/main/A0jyR3/master.m3u8?id=1';

        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(sumberVideo);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = sumberVideo;
            video.addEventListener('loadedmetadata', function() { video.play(); });
        }
    </script>
</body>
</html>
